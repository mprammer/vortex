[package]
name = "vortex-bench"
authors = { workspace = true }
description = "End to end vortex benchmarks"
edition = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = false
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[dependencies]
vortex = { workspace = true, features = [
    "object_store",
    "files",
    "tokio",
    "zstd",
] }
vortex-tensor = { workspace = true } # TODO(connor): In the future, this might be inside vortex.
vortex-onpair = { workspace = true }
# FSST-12, for the shared-decode-ABI experiment (src/fsst12_abi.rs). Aliased because the
# workspace already depends on the published 8-bit fsst-rs through vortex-fsst, and the
# 12-bit dialect is unpublished.
#
# Pinned by rev, not path: run.py stages jobs with `git archive`, which cannot carry a
# path dep out of this tree. The rev carries the FSST-12 training-budget fix (1 MB sample
# instead of FSST-8's 16 KB) without which the trained table is 88% empty -- see
# onpair-gpu-paper/docs/notes/2026-08-12-fsst12-normalizer-and-trainer-defect.md.
fsst12 = { package = "fsst-rs", git = "https://github.com/mprammer/fsst", rev = "196a862112c6ea028b0cc5e95c4fcabbf4088bd2" }
thiserror = { workspace = true }

anyhow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
bzip2 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
get_dir = { workspace = true }
glob = { workspace = true }
humansize = { workspace = true }
indicatif = { workspace = true, features = ["futures"] }
itertools = { workspace = true }
mimalloc = { workspace = true }
noodles-bgzf = { workspace = true, features = ["async"] }
noodles-vcf = { workspace = true, features = ["async"] }
parking_lot = { workspace = true }
parquet = { workspace = true, features = ["async"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tabled = { workspace = true, features = ["std"] }
target-lexicon = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tpchgen = { workspace = true }
tpchgen-arrow = { workspace = true }
tracing = { workspace = true }
tracing-perfetto = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "json",
    "tracing-log",
] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vortex-cuda = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }

[features]
cuda = ["dep:cudarc", "dep:vortex-cuda"]
unstable_encodings = ["vortex/unstable_encodings"]
